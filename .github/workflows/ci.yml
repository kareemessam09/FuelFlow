name: CI

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test -- --passWithNoTests

  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/FuelFlow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests if present
        shell: bash
        run: |
          if find test -type f -name "*_test.dart" | grep -q .; then
            flutter test
          else
            echo "No Flutter tests found. Skipping."
          fi

  release-apk:
    name: Build and publish APK release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/FuelFlow
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Restore Firebase Android config from secret
        shell: bash
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64" ]; then
            echo "Missing secret: FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64"
            echo "Create it in: Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          # Accept secret as:
          # 1) base64 of google-services.json
          # 2) raw JSON object
          # 3) JSON string containing escaped JSON
          python - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import sys

          raw = os.environ.get("FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64", "").strip()
          out = pathlib.Path("android/app/google-services.json")

          def write_if_valid(candidate: str, source: str) -> bool:
              try:
                  data = json.loads(candidate)
              except Exception:
                  return False
              if isinstance(data, str):
                  try:
                      data = json.loads(data)
                  except Exception:
                      return False
              if not isinstance(data, dict) or "project_info" not in data:
                  return False
              out.write_text(json.dumps(data, separators=(",", ":")), encoding="utf-8")
              print(f"Loaded Firebase config from {source}.")
              return True

          ok = False

          # Attempt base64 decode first
          try:
              decoded = base64.b64decode(raw, validate=True).decode("utf-8", errors="strict")
              ok = write_if_valid(decoded, "base64 secret")
          except Exception:
              ok = False

          # Then attempt raw/escaped JSON
          if not ok:
              ok = write_if_valid(raw, "raw JSON secret")

          if not ok:
              print("Invalid Firebase secret format. Provide base64 of google-services.json or raw JSON object.")
              sys.exit(1)
          PY

          test -s android/app/google-services.json

      - name: Build split-per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Publish GitHub release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/FuelFlow/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            app/FuelFlow/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            app/FuelFlow/build/app/outputs/flutter-apk/app-x86_64-release.apk
          generate_release_notes: true
