name: CI

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test -- --passWithNoTests

  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/FuelFlow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests if present
        shell: bash
        run: |
          if find test -type f -name "*_test.dart" | grep -q .; then
            flutter test
          else
            echo "No Flutter tests found. Skipping."
          fi

  release-apk:
    name: Build and publish APK release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/FuelFlow
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Restore Firebase Android config from secret
        shell: bash
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          # Optional in CI: if missing/invalid we continue without Firebase config.
          # Android build still succeeds because google-services plugin is conditionally applied only when file exists.
          python - <<'PY'
          import base64
          import json
          import os
          import pathlib

          raw = os.environ.get("FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64", "").strip()
          out = pathlib.Path("android/app/google-services.json")

          def maybe_write_json(candidate: str, source: str) -> bool:
              try:
                  data = json.loads(candidate)
              except Exception:
                  return False
              if isinstance(data, str):
                  try:
                      data = json.loads(data)
                  except Exception:
                      return False
              if not isinstance(data, dict) or "project_info" not in data:
                  return False
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(json.dumps(data, separators=(",", ":")), encoding="utf-8")
              print(f"Loaded Firebase config from {source}.")
              return True

          if not raw:
              print("FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64 is not set; continuing without Firebase config.")
              raise SystemExit(0)

          candidates = [raw]

          # Handle quoted secrets: '{...}' or "{...}"
          if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in ("'", '"'):
              candidates.append(raw[1:-1])

          # Try JSON forms first (raw object or escaped JSON string)
          ok = False
          for idx, c in enumerate(candidates, start=1):
              if maybe_write_json(c, f"raw JSON candidate #{idx}"):
                  ok = True
                  break

          # Then try base64 variants
          if not ok:
              compact = "".join(raw.split())
              for source, decoder_input in [
                  ("base64", compact),
                  ("base64url", compact),
              ]:
                  s = decoder_input
                  # Fix missing padding if needed
                  s += "=" * ((4 - len(s) % 4) % 4)
                  try:
                      if source == "base64":
                          decoded = base64.b64decode(s, validate=False).decode("utf-8", errors="strict")
                      else:
                          decoded = base64.urlsafe_b64decode(s).decode("utf-8", errors="strict")
                  except Exception:
                      continue
                  if maybe_write_json(decoded, source):
                      ok = True
                      break

          if not ok:
              if out.exists():
                  out.unlink()
              print("Firebase secret was provided but format is invalid. Continuing without Firebase config.")
          PY

      - name: Build split-per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Publish GitHub release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/FuelFlow/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            app/FuelFlow/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            app/FuelFlow/build/app/outputs/flutter-apk/app-x86_64-release.apk
          generate_release_notes: true
